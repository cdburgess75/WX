<!--
  WX v2026.08.16.013 — the whole app is one screen and one answer.
  No tabs, no cards, no scrolling. A rules engine picks the single most
  important thing about the next 12 hours and says it in one word.
  Data: Open-Meteo (CC BY 4.0) + NWS active alerts. No keys.
  Taps: temperature = °F/°C.  place name = change location.  mark = refresh.

  Versioning: vYYYY.MM.DD.NNN — NNN increments per shipped change that day
  (same scheme as SetList69).
  v2026.08.16.001  initial build (verdict engine, 12h bars, search, cache)
  v2026.08.16.002  sample-data fallback for blocked-network previews
  v2026.08.16.003  renamed STONE -> WX
  v2026.08.16.004  freeze verdict now scans the 12h ahead instead of today's
                   daily min (which by evening is this morning's low); sample
                   mode carries the real UTC offset so the NOW bar lines up
  v2026.08.16.005  sun-shower app icon: SVG favicon inline, apple-touch-icon
                   + icon-512 PNGs alongside (iOS won't take a data URI there)
  v2026.08.16.006  sun-shower skin: pastel sky palette matching the icon
                   (was cave-wall stone/ochre); moderate alerts show amber,
                   red reserved for severe/extreme; long alert names get a
                   smaller size so the verdict never swallows the screen
  v2026.08.16.007  the big one: 15-minute rain nowcast ("Rain in about 20
                   minutes"); tap an alert verdict to read the full NWS text;
                   tap an hour bar for that hour; day/dusk/night skins; air
                   quality verdict (Open-Meteo AQI); sunscreen line at UV 8+;
                   tropical alerts get their own words; phrasing varies by
                   day; favicon mirrors the current verdict; installable PWA
                   (manifest + service worker — the icon PNGs already broke
                   single-file purity, so the shell may as well work offline)
  v2026.08.16.008  share + sun/moon theme buttons top right (theme still
                   follows the clock until you pick); tap the UPDATED time
                   to refresh; version number links to the changelog; an
                   update pill appears when a newer version is deployed
  v2026.08.16.009  GPS-first: locates you automatically on launch (Loranger
                   is only the fallback), and a GPS-chosen spot follows you
                   on later opens; a town you picked by hand always wins.
                   Local time, skins, and sunrise/sunset ride along for free
  v2026.08.16.010  solid calm backgrounds (gradients out; night is deep
                   blue-black, not purple); the refresh stamp is a real
                   button with a ↻; the version link looks like a link;
                   TOMORROW line under the sentence (owed from the
                   improvement round — it was promised and missed)
  v2026.08.16.011  reverse geocode digs for the actual town: BigDataCloud's
                   locality field returns the parish in rural areas, so we
                   now mine localityInfo for the nearest named place and
                   skip anything that ends in Parish/County
  v2026.08.16.012  a saved location whose name is still a parish/county gets
                   re-resolved on next open even if you haven't moved —
                   otherwise the v011 fix never reaches an existing install
  v2026.08.16.013  new icon: in-house sun / storm-cloud / rain-cloud drawn
                   from the saved reference (our own artwork, no license
                   strings); palette re-tuned to it — richer orange and
                   blue; long place names ellipsize instead of running
                   under the corner buttons
-->
<style>
:root{
  --stone:#D8ECFB;      /* pastel sky (kept the old var names) */
  --stone2:#FFFFFF;
  --bone:#33475C;       /* ink: deep slate */
  --ochre:#D9821E;      /* sun orange, dark enough to read */
  --rust:#D8553E;       /* danger: warm coral */
  --water:#3576C9;      /* rain text */
  --ash:#7E93A6;        /* quiet text */
  --sans:system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#EAF3FC; color:var(--bone); font-family:var(--sans);
  display:flex; flex-direction:column; align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 12px);
  -webkit-text-size-adjust:100%; position:relative;
}
/* solid, calm skies — no gradients, no glow blobs */
.app{position:relative;z-index:1;width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0}

/* ---- place ---- */
.place{
  max-width:calc(100% - 200px);
  background:none;border:0;color:var(--ash);font:600 clamp(15px,4.2vw,18px)/1.2 var(--sans);
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:8px 12px;min-height:44px;
  display:flex;align-items:center;gap:9px;flex:none;
}
.place:active{color:var(--water)}
.place svg{opacity:.65}

/* ---- corner buttons: theme + share ---- */
.corner{position:absolute;top:2px;right:0;display:flex;gap:2px;z-index:2}
.corner button{
  background:none;border:0;color:var(--ash);cursor:pointer;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;padding:0;border-radius:12px;
}
.corner button:active{color:var(--bone)}

/* ---- the answer ---- */
.answer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.4vh,14px);min-height:0;width:100%}
.mark{width:clamp(96px,26vh,168px);height:clamp(96px,26vh,168px);flex:none;cursor:pointer}
.deg{
  background:none;border:0;color:var(--bone);cursor:pointer;padding:0;
  font:800 clamp(64px,17vh,132px)/.86 var(--sans);letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.deg u{text-decoration:none;font-size:.33em;font-weight:600;color:var(--ash);vertical-align:.9em;margin-left:.06em;letter-spacing:0}
.word{
  font:800 clamp(34px,9.4vh,66px)/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase;
  color:var(--ochre);text-align:center;
}
.word.bad{color:var(--rust)}
.word.wet{color:var(--water)}
.word.long{font-size:clamp(24px,5.8vh,42px);line-height:1.06}
.say{
  font:500 clamp(17px,2.6vh,22px)/1.35 var(--sans);color:var(--bone);opacity:.86;
  text-align:center;max-width:20ch;text-wrap:balance;
}
.tmrw{font:700 11.5px/1 var(--sans);letter-spacing:.18em;color:var(--ash);text-align:center}

/* ---- next 12 hours ---- */
.hours{width:100%;flex:none;padding-top:6px}
.bars{display:flex;align-items:flex-end;gap:clamp(3px,1.4vw,7px);height:clamp(48px,9vh,74px)}
.bars i{flex:1;border-radius:3px;background:#F5B82E;opacity:.55;min-height:5px}
.bars i.wet{background:#5B8DEF;opacity:.95}
.bars i.now{opacity:1;box-shadow:inset 0 0 0 2px var(--bone)}
.ticks{display:flex;justify-content:space-between;margin-top:9px;font:600 11.5px/1 var(--sans);letter-spacing:.18em;color:var(--ash)}

/* ---- footer ---- */
.foot{flex:none;font:500 11px/1.6 var(--sans);letter-spacing:.1em;color:#93A9BB;text-align:center;padding-top:10px}
.foot b{
  display:inline-flex;align-items:center;gap:7px;color:var(--ash);font-weight:700;cursor:pointer;
  border:1.5px solid currentColor;border-radius:99px;padding:9px 15px;margin-bottom:7px;
}
.foot b::before{content:"↻";font-size:14px;line-height:1}
.foot b:active{color:var(--bone)}
.foot a{color:var(--water);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.foot a::after{content:" ↗"}
.upd{
  display:block;margin:0 auto 8px;background:var(--ochre);color:#FFF;border:0;border-radius:99px;
  padding:10px 16px;font:700 12px/1 var(--sans);letter-spacing:.12em;cursor:pointer;
}
.upd[hidden]{display:none}
body.night .foot{color:#7E89B5}

/* ---- change place ---- */
.sheet{
  position:fixed;inset:0;z-index:5;background:rgba(235,247,254,.97);display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;
}
.sheet.open{display:flex}
.sheet input{
  width:100%;font:600 20px/1.2 var(--sans);color:var(--bone);background:var(--stone2);
  border:2px solid #BCD9EE;border-radius:12px;padding:16px;letter-spacing:.02em;
}
.sheet input:focus{outline:0;border-color:var(--ochre)}
.hits{list-style:none;margin-top:12px;overflow:auto;flex:1}
.hits li{
  padding:17px 4px;border-bottom:1px solid #D6E8F5;cursor:pointer;
  font:600 19px/1.25 var(--sans);display:flex;justify-content:space-between;gap:12px;align-items:baseline;
}
.hits li span{color:var(--ash);font-weight:500;font-size:15px;text-align:right}
.hits li:active{color:var(--ochre)}
.hits li.here{color:var(--ochre)}
.shut{
  margin-top:14px;background:none;border:2px solid #BCD9EE;border-radius:12px;color:var(--ash);
  font:700 16px/1 var(--sans);letter-spacing:.14em;padding:17px;cursor:pointer;text-transform:uppercase;
}
button:focus-visible,input:focus-visible,li:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}

/* ---- the sky follows the day ---- */
body.dusk{background:#F7DDB8}
body.night{background:#141C26;
  --bone:#E9EFF5;--ash:#93A6B8;--ochre:#FFC94F;--rust:#FF8A70;--water:#7FB8E6}
body.night .foot{color:#5F7183}
body.night .bars i{background:#FFC94F}
body.night .bars i.wet{background:#7FB8E6}

/* ---- the verdict opens the alert when there is one ---- */
.word.tap{cursor:pointer}
.alerttext{flex:1;overflow:auto;color:#33475C;font:500 17px/1.55 var(--sans);padding:6px 2px;white-space:pre-wrap}
.alerttext h2{font:800 22px/1.2 var(--sans);margin:0 0 10px;color:#C8820A}
.alerttext h2.bad{color:#D8553E}
.alerttext b{display:block;margin:16px 0 4px;font:700 12px/1 var(--sans);letter-spacing:.12em;color:#7E93A6;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .answer{animation:rise .5s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="app">
  <div class="corner">
    <button id="themeBtn" aria-label="Switch between light and dark"></button>
    <button id="shareBtn" aria-label="Share WX">
      <svg width="19" height="22" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-2"/><path d="M12 17V3"/><path d="M8 7l4-4 4 4"/></svg>
    </button>
  </div>
  <button class="place" id="place" aria-label="Change location">
    <svg width="13" height="17" viewBox="0 0 13 17" fill="currentColor" aria-hidden="true"><path d="M6.5 0C2.9 0 0 2.8 0 6.3 0 11 6.5 17 6.5 17S13 11 13 6.3C13 2.8 10.1 0 6.5 0zm0 8.9a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg>
    <span id="placeName" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">FINDING YOU</span>

  </div>
</div>

<div class="sheet" id="sheet">
  <input id="q" type="search" placeholder="Town name or ZIP" autocomplete="off" enterkeyhint="search">

  <div class="alerttext" id="alertText"></div>
  <button class="shut" id="alertShut">Close</button>

<script>
"use strict";
const VERSION="v2026.08.16.013";
/* ---------- tiny store ---------- */
const box=(()=>{let ok=true,m={};try{localStorage.setItem("_","1");localStorage.removeItem("_")}catch(e){ok=false}
 return{g(k,d){try{const v=ok?localStorage.getItem(k):m[k];return v?JSON.parse(v):d}catch(e){return d}},
 s(k,v){const j=JSON.stringify(v);try{if(ok)localStorage.setItem(k,j);else m[k]=j}catch(e){m[k]=j}}}})();

const HOME={name:"Loranger",lat:30.6013,lon:-90.3573};
let loc=box.g("wx.loc",HOME), F=box.g("wx.f",true), D=null, ALERTS=[], AQI=null, CURRENT_ALERT=null;
let sayT=null, sayOrig="";

const f=c=>F?c*9/5+32:c;
const mph=k=>k/1.609344;
const R=v=>Math.round(v);
const ms=s=>Date.parse(s.length===16?s+":00Z":s+"Z");
const now=()=>Date.now()+(D?D.utc_offset_seconds*1000:0);
function clock(s){let h=+s.slice(11,13);const ap=h>=12?"PM":"AM";h=h%12||12;return h+" "+ap}
function clockMin(s){let h=+s.slice(11,13);const mm=s.slice(14,16),ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+mm+" "+ap}
// Same answer all day, a different sentence tomorrow — variety without randomness.
const pick=a=>a[new Date().getDate()%a.length];

/* ---------- pictographs: drawn like something scratched on a wall ---------- */
const OCH="#F5A02E",BONE="#FFFFFF",WAT="#5B8DEF",RST="#D8553E",ASH="#93A8BD";
function pict(kind){
  const s=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w||5}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const sun=`<circle cx="50" cy="44" r="17" fill="${OCH}"/>`+
    [12,55,98,140,185,228,270,315].map((a,i)=>{const r=a*Math.PI/180,L=i%2?27:31;
      return s(`M${(50+Math.cos(r)*21).toFixed(0)} ${(44+Math.sin(r)*21).toFixed(0)}L${(50+Math.cos(r)*L).toFixed(0)} ${(44+Math.sin(r)*L).toFixed(0)}`,OCH,5)}).join("");
  const cloud=(c)=>s("M24 62c-9 0-13-6-12-12 1-6 7-9 12-8 1-11 11-17 20-15 7 1 12 6 14 13 8-2 15 3 16 10 1 7-4 12-11 12z",c||ASH,5);
  const drops=(n,c)=>Array.from({length:n},(_,i)=>s(`M${28+i*15} 72L${23+i*15} 88`,c||WAT,5)).join("");
  const bolt=`<path d="M53 62L36 84h13l-6 16 21-24H51l6-14z" fill="${OCH}" stroke="${OCH}" stroke-width="3" stroke-linejoin="round"/>`;
  const moon=`<path d="M62 24a25 25 0 1 0 15 41 27 27 0 0 1-15-41z" fill="${OCH}"/>`;
  const map={
    sun, moon,
    part:`<g transform="translate(6,-6) scale(.72)">${sun}</g>`+cloud(),
    partnight:`<g transform="translate(2,-4) scale(.66)">${moon}</g>`+cloud(),
    cloud:cloud(),
    rain:cloud()+drops(3),
    heavy:cloud()+drops(3)+s("M43 76L38 92",WAT,5),
    storm:cloud("#7B8FA0")+bolt,
    snow:cloud()+[0,1,2].map(i=>`<circle cx="${29+i*15}" cy="${80+(i%2)*7}" r="4.5" fill="${BONE}"/>`).join(""),
    fog:cloud()+s("M22 76h56",ASH,5)+s("M30 88h40",ASH,5),
    wind:s("M18 40h44a11 11 0 1 0-11-11",BONE,5)+s("M14 58h56a11 11 0 1 1-11 11",BONE,5)+s("M22 76h34",BONE,5),
    hot:`<circle cx="50" cy="42" r="19" fill="${RST}"/>`+[20,90,160,230,300].map(a=>{const r=a*Math.PI/180;
      return s(`M${(50+Math.cos(r)*24).toFixed(0)} ${(42+Math.sin(r)*24).toFixed(0)}L${(50+Math.cos(r)*33).toFixed(0)} ${(42+Math.sin(r)*33).toFixed(0)}`,RST,6)}).join(""),
    cold:s("M50 18v64M24 34l52 32M76 34L24 66",WAT,6),
    warn:`<path d="M50 14L92 86H8z" fill="none" stroke="${RST}" stroke-width="6" stroke-linejoin="round"/>`+
      s("M50 40v22",RST,7)+`<circle cx="50" cy="73" r="4" fill="${RST}"/>`,
    warn2:`<path d="M50 14L92 86H8z" fill="none" stroke="${OCH}" stroke-width="6" stroke-linejoin="round"/>`+
      s("M50 40v22",OCH,7)+`<circle cx="50" cy="73" r="4" fill="${OCH}"/>`
  };
  return map[kind]||map.cloud;
}

/* ---------- the verdict engine: one answer, in priority order ---------- */
const WET=new Set([51,53,55,56,57,61,63,65,66,67,80,81,82]);
const SNOW=new Set([71,73,75,77,85,86]);
const STORM=new Set([95,96,99]);

function verdict(){
  const c=D.current,h=D.hourly,i=hourNow();
  const nxt=k=>{const out=[];for(let j=i;j<Math.min(i+13,h.time.length);j++)out.push(h[k][j]);return out};
  const t=h.time.slice(i,i+13);
  const codes=nxt("weather_code"),pops=nxt("precipitation_probability"),gusts=nxt("wind_gusts_10m");
  const feels=f(c.apparent_temperature),temp=f(c.temperature_2m);
  // The low that matters is the one still ahead of us. daily.temperature_2m_min[0]
  // is *today's* min, so by evening it reports this morning's low — already spent.
  // Scanning the same 12-hour window as everything else is self-correcting.
  const lowAhead=f(Math.min(...nxt("temperature_2m")));
  const firstWet=codes.findIndex((x,k)=>(WET.has(x)||STORM.has(x)||SNOW.has(x))&&pops[k]>=45);
  const stormIn=codes.findIndex((x,k)=>STORM.has(x)&&pops[k]>=40);
  const maxGust=mph(Math.max(...gusts));
  const night=c.is_day===0;
  const uvMax=h.uv_index?Math.max(...nxt("uv_index")):0;

  // 1. a real warning beats everything — and the word is a door now, not a wall
  if(ALERTS.length){
    const a=ALERTS[0],sev=(a.severity||"").toLowerCase();
    const grave=sev==="extreme"||sev==="severe";
    const trop=/hurricane|tropical|surge/i.test(a.event||"");
    return{mark:grave?"warn":"warn2",cls:grave?"bad":"",word:shortEvent(a.event),alert:a,
      say:trop?(grave?"The real thing. Finish getting ready — tap for details.":"The tropics are stirring. Tap the words to read it.")
              :(grave?"Take this one seriously. Tap for details.":"There's an alert for this area. Tap it to read.")};
  }
  // 2. happening right now
  if(STORM.has(c.weather_code))return{mark:"storm",cls:"bad",word:"Storms",
    say:pick(["Thunderstorms overhead. Stay inside.","Lightning close by. Head in.","Storming right now. Wait it out inside."])};
  if(SNOW.has(c.weather_code))return{mark:"snow",cls:"wet",word:"Snow",say:"Snow falling now. Roads get slick."};
  if(WET.has(c.weather_code))return{mark:"rain",cls:"wet",word:"Raining",say:rainEnds(codes,pops,t)};
  // 3. dangerous air
  if(feels>=(F?103:39))return{mark:"hot",cls:"bad",word:"Dangerous heat",
    say:`Feels like ${R(feels)}°. ${pick(["Shade and water, no yard work.","Stay in the AC this afternoon.","This heat hurts people. Take it easy."])}`};
  if(feels>=(F?95:35))return{mark:"hot",cls:"bad",word:"Hot",
    say:`Feels like ${R(feels)}°. ${pick(["Drink more than you think you need.","Water first, everything else second.","Find the shade and stay there."])}`};
  if(feels<=(F?20:-7))return{mark:"cold",cls:"wet",word:"Bitter cold",say:`Feels like ${R(feels)}°. Cover skin, cover pipes.`};
  if(lowAhead<=(F?32:0))return{mark:"cold",cls:"wet",word:"Freeze tonight",say:`Down to ${R(lowAhead)}° tonight. Pipes, plants, pets.`};
  if(AQI!=null&&AQI>=151)return{mark:"fog",cls:"bad",word:"Bad air",
    say:AQI>=201?"Air is unhealthy today. Stay inside if you can.":"Air quality is poor. Take it easy outside."};
  // 4. coming at you — the 15-minute nowcast gets first say
  const soon=rainSoonMinutes();
  if(soon!=null&&stormIn<0)return{mark:"rain",cls:"wet",word:"Rain soon",
    say:soon<=5?"Rain any minute now. Grab a coat.":`Rain in about ${soon} minutes. ${pick(["Grab a coat.","Wrap it up outside.","Close the windows."])}`};
  if(stormIn>=0)return{mark:"storm",cls:"bad",word:"Storms coming",say:`Thunderstorms around ${clock(t[stormIn])}.`};
  if(firstWet>=0)return{mark:"rain",cls:"wet",
    word:firstWet<=2?"Rain soon":"Rain later",
    say:`Rain starts around ${clock(t[firstWet])}. ${firstWet<=2?"Grab a coat now.":"You have time."}`};
  if(maxGust>=30)return{mark:"wind",cls:"bad",word:"Windy",
    say:`Gusts to ${R(maxGust)} mph. ${pick(["Tie things down.","Hold onto your hat.","Not a day for the umbrella."])}`};
  // 5. nothing wrong — say so and get out of the way
  if(feels<=(F?45:7))return{mark:night?"moon":"cloud",cls:"",word:"Cold",
    say:`${R(temp)}° and dry. ${pick(["Wear a real coat.","Layer up before you go.","Gloves weather."])}`};
  const clear=c.weather_code<=1;
  const tail=(!night&&uvMax>=8)?"Strong sun — wear sunscreen.":pick(["Go outside.","Get out there.","Enjoy it."]);
  return{mark:night?(clear?"moon":"partnight"):(clear?"sun":c.weather_code===2?"part":"cloud"),cls:"",
    word:feels>=(F?80:27)?"Warm":"Good",
    say:`${R(temp)}° and no rain coming. ${tail}`};
}
/* The 15-minute nowcast: minutes until rain reaches this spot, or null.
   Dark Sky's old trick — Open-Meteo serves the same data for free. */
function rainSoonMinutes(){
  const m=D.minutely_15;if(!m||!m.time||!m.precipitation)return null;
  const n=now();let s=-1;
  for(let k=0;k<m.time.length;k++){if(ms(m.time[k])<=n)s=k;else break}
  if(s<0)return null;
  for(let k=s;k<Math.min(s+9,m.time.length);k++){
    if((m.precipitation[k]||0)>=0.1){
      const mins=Math.max(0,Math.round((ms(m.time[k])-n)/60000));
      if(mins<=90)return mins;
    }
  }
  return null;
}
// Keep the full event name. Dropping the trailing Warning/Watch/Advisory would fit
// the one-word slot better, but it would also render "Tornado Watch" and "Tornado
// Warning" identically, and that distinction is the whole point of the alert.
function shortEvent(e){return String(e).slice(0,28)}
function rainEnds(codes,pops,t){
  const m=D.minutely_15;
  if(m&&m.time&&m.precipitation){
    const n=now();let s=0;
    for(let k=0;k<m.time.length;k++)if(ms(m.time[k])<=n)s=k;
    for(let k=s+1;k<m.time.length-1;k++)
      if((m.precipitation[k]||0)<0.1&&(m.precipitation[k+1]||0)<0.1)
        return`Should ease up around ${clockMin(m.time[k])}.`;
  }
  for(let k=1;k<codes.length;k++)if(!(WET.has(codes[k])||STORM.has(codes[k]))||pops[k]<40)return`Should ease up by ${clock(t[k])}.`;
  return"Set in for a while.";
}
function hourNow(){const h=D.hourly.time,n=now();for(let i=h.length-1;i>=0;i--)if(ms(h[i])<=n)return i;return 0}

/* ---------- paint ---------- */
function paint(){
  setSkin();
  const v=verdict(),c=D.current,h=D.hourly,i=hourNow();
  CURRENT_ALERT=v.alert||null;
  if(sayT){clearTimeout(sayT);sayT=null}
  document.getElementById("mark").innerHTML=pict(v.mark);
  document.getElementById("deg").innerHTML=R(f(c.temperature_2m))+"<u>°</u>";
  const w=document.getElementById("word");w.textContent=v.word;
  w.className="word "+v.cls+(v.word.length>14?" long":"")+(v.alert?" tap":"");
  document.getElementById("say").textContent=v.say;
  document.getElementById("placeName").textContent=loc.name.toUpperCase();
  setFavicon(v.mark);
  // Tomorrow in one small line: hi/lo and the first thing that falls
  const tEl=document.getElementById("tmrw"),dd=D.daily;
  if(v.alert||!dd||!dd.time||!dd.time[1]){tEl.hidden=true}
  else{
    const day2=dd.time[1];let ev="NO RAIN";
    for(let j=0;j<h.time.length;j++){
      if(h.time[j].slice(0,10)!==day2)continue;
      if(STORM.has(h.weather_code[j])&&(h.precipitation_probability[j]||0)>=40){ev="STORMS AROUND "+clock(h.time[j]);break}
    }
    if(ev==="NO RAIN")for(let j=0;j<h.time.length;j++){
      if(h.time[j].slice(0,10)!==day2)continue;
      if(WET.has(h.weather_code[j])&&(h.precipitation_probability[j]||0)>=45){ev="RAIN AROUND "+clock(h.time[j]);break}
    }
    tEl.hidden=false;
    tEl.textContent=`TOMORROW ${R(f(dd.temperature_2m_max[1]))}°/${R(f(dd.temperature_2m_min[1]))}° · ${ev}`;
  }

  const bars=document.getElementById("bars");bars.innerHTML="";
  const temps=[];for(let j=i;j<Math.min(i+12,h.time.length);j++)temps.push(f(h.temperature_2m[j]));
  const lo=Math.min(...temps),hi=Math.max(...temps),sp=Math.max(hi-lo,F?12:7);
  temps.forEach((tp,k)=>{
    const j=i+k,pop=h.precipitation_probability[j]||0;
    const b=document.createElement("i");
    b.style.height=(22+((tp-lo)/sp)*74).toFixed(0)+"%";
    if(pop>=45)b.className="wet";
    if(k===0)b.className+=" now";
    b.title=clock(h.time[j])+" · "+R(tp)+"° · "+pop+"%";
    b.dataset.info=clock(h.time[j])+" — "+R(tp)+"°, "+pop+"% chance of rain";
    bars.appendChild(b);
  });
  document.getElementById("tickMid").textContent=temps.length>6?clock(h.time[i+6]):"+6";
}

/* ---------- the sky follows the clock ---------- */
const SUN_ICO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/></svg>';
const MOON_ICO='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.5 3a8.5 8.5 0 1 0 6.5 14 9.5 9.5 0 0 1-6.5-14z"/></svg>';
function setSkin(){
  // The clock decides until the person does; a picked theme sticks.
  const pref=box.g("wx.theme","auto");
  let skin="";
  if(pref==="dark")skin="night";
  else if(pref!=="light"){
    try{
      const d=D.daily,n=now(),up=ms(d.sunrise[0]),dn=ms(d.sunset[0]);
      if(n<up-30*60000||n>dn+30*60000)skin="night";
      else if(n>dn-70*60000||n<up+40*60000)skin="dusk";
    }catch(e){skin=D&&D.current&&D.current.is_day===0?"night":""}
  }
  document.body.className=skin;
  const tb=document.getElementById("themeBtn");
  if(tb)tb.innerHTML=skin==="night"?SUN_ICO:MOON_ICO;
  const tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.setAttribute("content",skin==="night"?"#141C26":skin==="dusk"?"#F7DDB8":"#EAF3FC");
}
/* ---------- the tab shows the weather too ---------- */
function setFavicon(mark){
  const l=document.querySelector('link[rel="icon"]');if(!l)return;
  const night=document.body.className==="night";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="${night?"#1B2634":"#EAF3FC"}"/>${pict(mark)}</svg>`;
  l.setAttribute("href","data:image/svg+xml,"+encodeURIComponent(svg));
}

/* ---------- data ---------- */
async function load(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`+
      `&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_gusts_10m`+
      `&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_gusts_10m,uv_index`+
      `&minutely_15=precipitation&forecast_minutely_15=16`+
      `&daily=temperature_2m_min,temperature_2m_max,sunrise,sunset&timezone=auto&forecast_days=3`;
    const [fc,al,aq]=await Promise.all([
      fetch(u).then(r=>{if(!r.ok)throw new Error("forecast");return r.json()}),
      fetch(`https://api.weather.gov/alerts/active?point=${loc.lat.toFixed(4)},${loc.lon.toFixed(4)}`)
        .then(r=>r.ok?r.json():{features:[]}).then(j=>(j.features||[]).map(x=>x.properties)
        .filter(p=>p&&p.event&&["extreme","severe","moderate"].includes((p.severity||"").toLowerCase())))
        .catch(()=>[]),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&current=us_aqi`)
        .then(r=>r.ok?r.json():null).then(j=>j&&j.current&&j.current.us_aqi!=null?Math.round(j.current.us_aqi):null)
        .catch(()=>null)
    ]);
    D=fc;ALERTS=al;AQI=aq;box.s("wx.cache",{at:Date.now(),loc,fc,al,aqi:aq});
    paint();stamp("UPDATED "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
    checkUpdate();
  }catch(e){
    const c=box.g("wx.cache",null);
    if(c&&c.loc.lat===loc.lat&&c.loc.lon===loc.lon){
      D=c.fc;ALERTS=c.al||[];AQI=c.aqi!=null?c.aqi:null;paint();
      const m=Math.round((Date.now()-c.at)/60000);
      stamp("OFFLINE · "+(m<60?m+" MIN OLD":Math.round(m/60)+" HR OLD"));
    }else{
      D=demoData();ALERTS=[];AQI=null;paint();
      stamp("SAMPLE · OPEN IN A BROWSER FOR LIVE DATA");
    }
  }
}

function here(){

      const j=await r.json();name=placeFrom(j);

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}


/* ---------- baked-in sample so the app is never a blank wall ----------
   Used only when the network is blocked (chat preview, Quick Look) AND
   there's no cached real forecast. Live data replaces it on first fetch. */
function demoData(){
  const t=[],T=[],A=[],P=[],C=[];
  const start=new Date();start.setMinutes(0,0,0);
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"T"+String(d.getHours()).padStart(2,"0")+":00";
  for(let i=0;i<72;i++){
    const d=new Date(start.getTime()+i*3600000),h=d.getHours();
    t.push(iso(d));
    const base=27+7*Math.sin((h-9)/24*2*Math.PI);       // 27–34 °C swing
    T.push(+base.toFixed(1));
    A.push(+(base+ (base>30?5:1)).toFixed(1));           // muggy feels-like
    const stormy=h>=15&&h<=19;                           // afternoon pop-ups
    P.push(stormy?55:h>=13&&h<21?30:10);
    C.push(stormy&&i>2&&i<9?95:base>30?2:1);
  }
  // The rows above are built from the local clock, so the offset has to match or
  // hourNow() lands the NOW bar several hours off on any machine that isn't on UTC.
  return {utc_offset_seconds:-new Date().getTimezoneOffset()*60,
    current:{temperature_2m:T[0],apparent_temperature:A[0],
      is_day:(start.getHours()>=6&&start.getHours()<20)?1:0,
      weather_code:C[0],wind_gusts_10m:24},
    hourly:{time:t,temperature_2m:T,apparent_temperature:A,precipitation_probability:P,weather_code:C,wind_gusts_10m:T.map(()=>24)},
    daily:{time:[t[0].slice(0,10),t[24].slice(0,10),t[48].slice(0,10)],
      temperature_2m_min:[24,24.5,24],temperature_2m_max:[34,35,34],
      sunrise:[t[0].slice(0,10)+"T06:30"],sunset:[t[0].slice(0,10)+"T19:45"]}};
}

const cached=box.g("wx.cache",null);
if(cached&&cached.loc.lat===loc.lat&&cached.loc.lon===loc.lon){D=cached.fc;ALERTS=cached.al||[];AQI=cached.aqi!=null?cached.aqi:null;paint();stamp("SAVED COPY")}
load();
/* GPS decides where "here" is — quietly, after the first paint. A location the
   person typed in stays put; one that came from GPS follows them around.
   First run has nothing saved, so GPS wins there too (Loranger is only the
   fallback while we wait, or if permission is denied). */
function dist(a,b,c,d){const x=(d-b)*Math.cos((a+c)*Math.PI/360),y=c-a;return Math.sqrt(x*x+y*y)*111.32}
/* BigDataCloud's top-level "locality" is often the parish out here. The real
   town usually hides in localityInfo — take the most specific named place
   that isn't an administrative blob. */
function placeFrom(j){
  const bad=/\b(parish|county|borough|census|district|township of)\b/i;
  for(const n of [j.city,j.locality])if(n&&!bad.test(n))return n;
  let best=null,bestOrder=-1;
  const info=j.localityInfo||{};
  for(const pool of [info.informative||[],info.administrative||[]])
    for(const e of pool){
      if(!e||!e.name||bad.test(e.name))continue;
      const d=(e.description||"").toLowerCase();
      const towny=/city|town|village|hamlet|populated place|suburb|community/.test(d)||(e.adminLevel!=null&&e.adminLevel>=7);
      if(towny&&(e.order||0)>bestOrder){best=e.name;bestOrder=e.order||0}
    }
  return best||j.city||j.locality||j.principalSubdivision||"Here";
}
function gpsSync(){
  if(!navigator.geolocation)return;
  const saved=box.g("wx.loc",null);
  if(saved&&!saved.gps)return;
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(4),lon=+p.coords.longitude.toFixed(4);
    const staleName=/\b(parish|county|borough|census|district)\b/i.test(saved&&saved.name||"");
    if(saved&&saved.gps&&dist(saved.lat,saved.lon,lat,lon)<2&&!staleName)return;
    let name="Here";
    try{
      const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
      const j=await r.json();name=placeFrom(j);
    }catch(e){}
    loc={name,lat,lon,gps:true};box.s("wx.loc",loc);
    stamp("CHECKING…");load();
  },()=>{},{timeout:8000,maximumAge:600000});
}
gpsSync();
setInterval(()=>{if(!document.hidden)load()},900000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
